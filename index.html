
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>Instagram Account Portal</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #101014;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.logo {
  width: 105px;
  height: 105px;
  margin: 0 auto 30px;
  border-radius: 27px;
  background: linear-gradient(
    45deg,
    #ffd776,
    #ff543e,
    #c837ab,
    #515bd4
  );
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 75px;
  font-weight: 300;
}

h1 {
  font-size: 30px;
  margin-bottom: 15px;
}

.description {
  color: #aaa;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 40px;
}

button {
  width: 100%;
  padding: 18px;
  background: #2879ed;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: .8;
}

.footer {
  color: #888;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 28px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">◎</div>

  <h1>Account Portal</h1>

  <p class="description">
    Access Instagram's official platform
    to manage your account and personal information.
  </p>

  <button onclick="window.location.href='https://www.instagram.com/'">
    Continue to Instagram
  </button>

  <div class="footer">
    Secure official Instagram access.<br>
    No login credentials are collected or stored here.
  </div>

</div>

</body>
</html>
